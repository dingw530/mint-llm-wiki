<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' http://localhost:* ws://localhost:*; object-src 'none'; base-uri 'self';"
    />
    <title>Mint</title>
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: #f1f5f3;
      }
      #boot-splash {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background:
          radial-gradient(circle at top left, rgba(42, 168, 125, 0.06), transparent 42%),
          linear-gradient(180deg, #f7faf8 0%, #f1f5f3 100%);
        color: #1c1c1c;
        z-index: 9999;
        transition:
          opacity 180ms ease,
          transform 180ms ease;
        overflow: hidden;
      }
      #boot-splash.is-fading {
        opacity: 0;
        transform: translateY(-2px);
      }
      #boot-splash .boot-body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        font-family:
          -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', sans-serif;
      }
      #boot-splash .boot-brand-title {
        font-size: 22px;
        font-weight: 680;
        letter-spacing: 0.3px;
        color: #1c1c1c;
      }
      #boot-splash .boot-dots {
        display: flex;
        gap: 6px;
      }
      #boot-splash .boot-dots span {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #2aa87d;
        animation: bootPulse 1.2s infinite ease-in-out;
      }
      #boot-splash .boot-dots span:nth-child(2) {
        animation-delay: 0.15s;
      }
      #boot-splash .boot-dots span:nth-child(3) {
        animation-delay: 0.3s;
      }
      #boot-splash .boot-caption {
        font-size: 13px;
        color: #6a6a6a;
      }
      @keyframes bootPulse {
        0%,
        80%,
        100% {
          transform: scale(0.75);
          opacity: 0.45;
        }
        40% {
          transform: scale(1);
          opacity: 1;
        }
      }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="boot-splash" aria-hidden="true">
      <div class="boot-body">
        <div class="boot-brand-title">Mint</div>
        <div class="boot-dots"><span></span><span></span><span></span></div>
        <div class="boot-caption">正在启动</div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
