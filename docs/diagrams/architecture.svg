<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="960" viewBox="0 0 1920 960" role="img" aria-labelledby="title desc">
  <title id="title">Mint：产品架构与 Agent Runtime</title>
  <desc id="desc">横向展示 Mint 调用入口、宿主组合、可移植 ReAct 核心、模型适配器、受治理工具执行，以及上下文、AgentRun、Wiki 和持久化能力。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7faff"/><stop offset="1" stop-color="#edf3fa"/></linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2563eb"/><stop offset="1" stop-color="#4f46e5"/></linearGradient>
    <linearGradient id="governed" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f766e"/><stop offset="1" stop-color="#0e7490"/></linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="145%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#17324d" flood-opacity="0.10"/></filter>
    <marker id="blueArrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8 Z" fill="#2563eb"/></marker>
    <marker id="orangeArrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8 Z" fill="#ea580c"/></marker>
    <marker id="purpleArrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8 Z" fill="#7c3aed"/></marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
      .title { font-size: 34px; font-weight: 700; fill: #102a43; }
      .subtitle { font-size: 16px; fill: #627d98; }
      .section { font-size: 18px; font-weight: 700; fill: #17324d; }
      .heading { font-size: 20px; font-weight: 700; fill: #102a43; }
      .headingLight { font-size: 21px; font-weight: 700; fill: #ffffff; }
      .body { font-size: 15px; fill: #486581; }
      .bodyLight { font-size: 14px; fill: #e0f2fe; }
      .mono { font-size: 13px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #334e68; }
      .monoLight { font-size: 13px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #ffffff; }
      .small { font-size: 12px; fill: #627d98; }
    </style>
  </defs>
  <rect width="1920" height="960" fill="url(#bg)"/>
  <rect x="26" y="22" width="1868" height="916" rx="24" fill="#ffffff" opacity="0.88"/>
  <text x="64" y="74" class="title">Mint 技术架构</text>
  <text x="64" y="104" class="subtitle">从调用入口到 Agent 执行、知识检索与可恢复运行</text>
  <text x="1850" y="76" text-anchor="end" class="small">产品架构 · Agent Runtime</text>
  <rect x="52" y="132" width="1816" height="228" rx="20" fill="#f0f7ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="78" y="166" class="section">① 请求与模型调用</text>
  <g filter="url(#shadow)"><rect x="78" y="190" width="210" height="126" rx="16" fill="#ffffff" stroke="#93c5fd" stroke-width="1.6"/></g>
  <text x="100" y="226" class="heading">调用入口</text>
  <text x="100" y="258" class="body">React Web · Electron</text>
  <text x="100" y="282" class="body">HTTP/SSE · IPC · CLI · Eval</text>
  <text x="100" y="299" class="mono">对话 · 注册端点</text>
  <g filter="url(#shadow)"><rect x="330" y="190" width="310" height="126" rx="16" fill="#ffffff" stroke="#6ee7b7" stroke-width="1.6"/></g>
  <text x="352" y="226" class="heading">Mint 宿主组合</text>
  <text x="352" y="258" class="body">Bootstrap · AgentRuntimePorts</text>
  <text x="352" y="282" class="body">注入模型、工具、上下文与 AgentRun</text>
  <text x="352" y="299" class="mono">runAgentChat → reactChat</text>
  <g filter="url(#shadow)"><rect x="680" y="190" width="250" height="126" rx="16" fill="#ffffff" stroke="#6ee7b7" stroke-width="1.6"/></g>
  <text x="702" y="226" class="heading">Mint ReAct Adapter</text>
  <text x="702" y="258" class="body">消息与工具类型映射</text>
  <text x="702" y="282" class="body">Mint 事件与结果适配</text>
  <text x="702" y="299" class="mono">createMintReactAgent</text>
  <g filter="url(#shadow)"><rect x="970" y="184" width="360" height="138" rx="16" fill="url(#core)" stroke="#818cf8" stroke-width="1.6"/></g>
  <text x="992" y="220" class="headingLight">@mint/react-runtime</text>
  <text x="992" y="252" class="bodyLight">可移植 ReAct 循环</text>
  <text x="992" y="276" class="bodyLight">ModelPort · ToolExecutor · 事件</text>
  <text x="992" y="302" class="monoLight">maxSteps · AbortSignal · typed result</text>
  <g filter="url(#shadow)"><rect x="1370" y="190" width="470" height="126" rx="16" fill="#ffffff" stroke="#c4b5fd" stroke-width="1.6"/></g>
  <text x="1392" y="226" class="heading">AI Adapter 与模型 Provider</text>
  <text x="1392" y="258" class="body">Vercel AI SDK · OpenAI · Anthropic</text>
  <text x="1392" y="282" class="body">OpenAI-compatible 端点</text>
  <text x="1392" y="299" class="mono">Provider 协议由宿主适配</text>
  <path d="M288 253 H322" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#blueArrow)"/>
  <path d="M640 253 H672" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#blueArrow)"/>
  <path d="M930 253 H962" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#blueArrow)"/>
  <path d="M1330 253 H1362" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#blueArrow)"/>
  <path d="M1372 285 H1338" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#blueArrow)"/>
  <text x="78" y="343" class="small">Web 通过 HTTP/SSE；Electron 的对话流和注册端点通过 preload IPC 进入主进程。</text>
  <rect x="52" y="382" width="1816" height="244" rx="20" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/>
  <text x="78" y="416" class="section">② 工具调用与治理</text>
  <g filter="url(#shadow)"><rect x="360" y="444" width="390" height="126" rx="16" fill="#ffffff" stroke="#5eead4" stroke-width="1.6"/></g>
  <text x="382" y="480" class="heading">Mint 工具适配层</text>
  <text x="382" y="512" class="body">ToolLoopEngine · ToolExecutionService</text>
  <text x="382" y="536" class="body">重试、审批恢复、调用记录与审计</text>
  <text x="382" y="553" class="mono">宿主应用策略</text>
  <g filter="url(#shadow)"><rect x="790" y="438" width="400" height="138" rx="16" fill="url(#governed)" stroke="#0f766e" stroke-width="1.6"/></g>
  <text x="812" y="474" class="headingLight">@mint/tool-runtime</text>
  <text x="812" y="506" class="bodyLight">查找 · 校验 · 授权 / 审批</text>
  <text x="812" y="530" class="bodyLight">取消 · 超时 · 单次执行</text>
  <text x="814" y="556" class="monoLight">可移植注册表 · 结构化结果</text>
  <g filter="url(#shadow)"><rect x="1230" y="444" width="520" height="126" rx="16" fill="#ffffff" stroke="#6ee7b7" stroke-width="1.6"/></g>
  <text x="1252" y="480" class="heading">工具与外部能力</text>
  <text x="1252" y="512" class="body">Wiki · 文件 · Bash · HTTP</text>
  <text x="1252" y="536" class="body">MCP Server · 知识图谱</text>
  <text x="1252" y="553" class="mono">处理器由 Mint 宿主提供</text>
  <path d="M1150 322 V366 H555 V436" fill="none" stroke="#ea580c" stroke-width="2.5" marker-end="url(#orangeArrow)"/>
  <rect x="692" y="350" width="100" height="24" rx="8" fill="#ffffff"/>
  <text x="742" y="367" text-anchor="middle" class="small">工具调用</text>
  <path d="M750 507 H782" fill="none" stroke="#ea580c" stroke-width="2.5" marker-end="url(#orangeArrow)"/>
  <path d="M1190 507 H1222" fill="none" stroke="#ea580c" stroke-width="2.5" marker-end="url(#orangeArrow)"/>
  <path d="M1490 576 V600 H1210 V335 H1150 V322" fill="none" stroke="#7c3aed" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#purpleArrow)"/>
  <rect x="1270" y="588" width="220" height="24" rx="8" fill="#ffffff"/>
  <text x="1380" y="605" text-anchor="middle" class="small">结果回到上下文，进入下一轮</text>
  <rect x="52" y="648" width="1816" height="222" rx="20" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="78" y="682" class="section">③ 宿主能力与持久化</text>
  <g filter="url(#shadow)"><rect x="78" y="704" width="410" height="126" rx="16" fill="#ffffff" stroke="#93c5fd" stroke-width="1.6"/></g>
  <text x="100" y="740" class="heading">上下文与记忆</text>
  <text x="100" y="772" class="body">预算 · 摘要 · 对话裁剪</text>
  <text x="100" y="796" class="body">长期记忆 · 大工具结果 Artifact</text>
  <text x="100" y="813" class="mono">context-window · memory</text>
  <g filter="url(#shadow)"><rect x="520" y="704" width="410" height="126" rx="16" fill="#ffffff" stroke="#c4b5fd" stroke-width="1.6"/></g>
  <text x="542" y="740" class="heading">AgentRun 与恢复</text>
  <text x="542" y="772" class="body">生命周期 · 有序持久事件</text>
  <text x="542" y="796" class="body">中断重建 · 未知工具结果不自动重放</text>
  <text x="542" y="813" class="mono">AgentRun · SQLite event log</text>
  <g filter="url(#shadow)"><rect x="962" y="704" width="410" height="126" rx="16" fill="#ffffff" stroke="#6ee7b7" stroke-width="1.6"/></g>
  <text x="984" y="740" class="heading">Wiki / RAG</text>
  <text x="984" y="772" class="body">全文与向量召回 · RRF</text>
  <text x="984" y="796" class="body">可选 Jev 重排 · 来源引用</text>
  <text x="984" y="813" class="mono">Markdown · FTS · sqlite-vec / Chroma</text>
  <g filter="url(#shadow)"><rect x="1404" y="704" width="410" height="126" rx="16" fill="#ffffff" stroke="#fdba74" stroke-width="1.6"/></g>
  <text x="1426" y="740" class="heading">存储与观测</text>
  <text x="1426" y="772" class="body">SSE / IPC · SQLite · 本地文件</text>
  <text x="1426" y="796" class="body">Langfuse · OpenTelemetry · 工具审计</text>
  <text x="1426" y="813" class="mono">外部 API 由用户配置</text>
  <text x="78" y="906" class="small">可移植包提供最小执行机制；provider、权限、审批、重试、持久化、传输与观测由 Mint 宿主负责。</text>
</svg>
