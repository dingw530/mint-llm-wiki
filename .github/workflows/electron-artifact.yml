name: Electron Artifact

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/electron/**'
      - 'scripts/rebuild-native.cjs'
      - 'scripts/with-node-version.cjs'
      - 'scripts/verify-electron-artifact.mjs'
      - 'package.json'
      - 'package-lock.json'
  push:
    branches: [main]
    paths:
      - 'apps/electron/**'
      - 'scripts/rebuild-native.cjs'
      - 'scripts/with-node-version.cjs'
      - 'scripts/verify-electron-artifact.mjs'
      - 'package.json'
      - 'package-lock.json'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-macos-artifact:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20.19.4'
      - run: npm ci
      - run: npm run verify:electron-artifact:mac
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: electron-artifact-evidence
          path: apps/electron/release/**/verification-evidence.json
          if-no-files-found: ignore
